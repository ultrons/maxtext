# DIAGNOSTIC v2: jax.distributed.initialize on composed 4x8x8 with a DNS-stability barrier
# (all 64 peers must resolve before any process calls initialize) + long init timeout.
# Tests whether the "newer incarnation" collision is a startup race (barrier fixes it)
# or the composed-superslice stock-JAX path (still fails -> isolation ladder).
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: siv-jaxinit2-4x8x8
  namespace: default
spec:
  failurePolicy:
    maxRestarts: 0
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - name: worker
    replicas: 1
    template:
      metadata:
        labels:
          kueue.x-k8s.io/queue-name: multislice-queue
        annotations:
          cloud.google.com/gke-tpu-slice-topology: 4x8x8
      spec:
        parallelism: 64
        completions: 64
        backoffLimit: 0
        completionMode: Indexed
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: 4x8x8
              cloud.google.com/skip-tpu-webhook-check: "true"
              kueue.k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-required-topology: cloud.google.com/gce-topology-block
              kueue.x-k8s.io/podset-slice-required-topology: cloud.google.com/gke-tpu-partition-4x4x4-id
              kueue.x-k8s.io/podset-slice-size: "16"
              kueue.x-k8s.io/safe-to-forcefully-delete: "true"
          spec:
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/reservation-name: ghostfish-y6kzjgh4shlno
            tolerations:
            - { key: google.com/tpu, operator: Equal, value: present, effect: NoSchedule }
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/integrate_v2:1410-upstream-ac9498b64
              imagePullPolicy: IfNotPresent
              command: ["bash","-c"]
              args:
              - |
                set -u
                # --- DNS-stability barrier: wait until all 64 peers resolve, twice in a row ---
                IFS=',' read -ra HOSTS <<< "$TPU_WORKER_HOSTNAMES"
                N=${#HOSTS[@]}
                echo "WID=$TPU_WORKER_ID barrier: waiting for $N peer DNS names..."
                stable=0
                for attempt in $(seq 1 150); do
                  ok=1
                  for h in "${HOSTS[@]}"; do getent hosts "$h" >/dev/null 2>&1 || { ok=0; break; }; done
                  if [ $ok -eq 1 ]; then stable=$((stable+1)); else stable=0; fi
                  [ $stable -ge 2 ] && { echo "WID=$TPU_WORKER_ID all $N DNS stable at attempt $attempt"; break; }
                  sleep 2
                done
                # small extra settle so late pods finish ContainerCreating
                sleep 10
                python3 -c '
                import time,os
                t0=time.time()
                import jax
                wid=os.environ.get("TPU_WORKER_ID")
                print("WID",wid,"calling initialize...",flush=True)
                jax.distributed.initialize(initialization_timeout=900)
                print("WID",wid,"RESULT_INIT_OK dt=%.1f"%(time.time()-t0),"global=",jax.device_count(),"local=",jax.local_device_count(),flush=True)
                import jax.numpy as jnp
                x=jnp.ones(jax.local_device_count())
                s=float(jnp.sum(jax.pmap(lambda a: jax.lax.psum(a,"i"),axis_name="i")(x)))
                print("WID",wid,"RESULT_COLLECTIVE_OK psum=",s,flush=True)
                '
                echo "PYEXIT=$? WID=$TPU_WORKER_ID"
                sleep 180
              env:
              - { name: PYTHONUNBUFFERED, value: "1" }
              resources:
                limits:
                  google.com/tpu: "4"
                requests:
                  google.com/tpu: "4"
