# DRAFT — 14.10 best-baseline re-run on bodaborg-tpu7x-nap (4x8x8 = 256 chips / 64 hosts).
# Preempts the gu-ubench harness via WorkloadPriorityClass siv-preempt (value 2000).
# Requires the one-time `siv-preempt` WorkloadPriorityClass (see infra/bodaborg-preempt-priority.md Step 1).
# Coordinator env is injected by the GKE TPU webhook (as in the existing dsv3-train-4x8x8 JobSets).
# CHUNK and steps left as the pre-launch decisions; CHUNK=2 = exact 14.10 record.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: siv-1410-4x8x8
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: multislice-queue
    kueue.x-k8s.io/priority-class: siv-preempt
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  failurePolicy:
    maxRestarts: 3          # SC-fatal flake tolerance (per ds-conv3 run-blocker lesson)
  replicatedJobs:
  - name: slice
    replicas: 1
    template:
      spec:
        parallelism: 64
        completions: 64
        backoffLimit: 0
        completionMode: Indexed
        template:
          metadata:
            annotations:
              cloud.google.com/gke-tpu-slice-topology: "4x8x8"
          spec:
            restartPolicy: Never
            nodeSelector:
              cloud.google.com/gke-tpu-accelerator: tpu7x
              cloud.google.com/gke-tpu-topology: 4x8x8
            tolerations:
            - { key: google.com/tpu, operator: Exists, effect: NoSchedule }
            containers:
            - name: trainer
              image: gcr.io/tpu-vm-gke-testing/integrate_v2:1410-upstream-ac9498b64
              imagePullPolicy: Always
              command: ["bash","-c"]
              args:
              - |
                export LIBTPU_INIT_ARGS="--xla_enable_async_all_gather=true --xla_lhs_prioritize_async_depth_over_stall=true --xla_sc_disable_megacore_partitioning=True --xla_tpu_aggressive_opt_barrier_removal=true --xla_tpu_bf16_emission_mode=NATIVE_EMISSION --xla_tpu_dvfs_p_state=7 --xla_tpu_enable_3d_reduce_scatter_decomposer=false --xla_tpu_enable_all_gather_offload_tracing=true --xla_tpu_enable_async_collective_fusion_fuse_all_gather=false --xla_tpu_enable_concurrent_sparse_core_offloading=true --xla_tpu_enable_latency_hiding_layer_scheduler=true --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=false --xla_tpu_enable_offloading_gather_to_sparsecore=true --xla_tpu_enable_sparse_core_collective_aggregator=true --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true --xla_tpu_enable_sparse_core_collective_offload_all_gather=true --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true --xla_tpu_enable_sparse_core_offload_queuing_in_lhs=true --xla_tpu_enable_sparse_core_reduce_scatter_v2=true --xla_tpu_pcie_bandwidth_multiplier=0.03 --xla_tpu_prefer_async_allgather_to_allreduce=true --xla_tpu_scheduler_percent_shared_memory_limit=150 --xla_tpu_scoped_vmem_limit_kib=65472 --xla_tpu_sparse_core_all_gather_latency_multiplier=1 --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3 --xla_tpu_spmd_rng_bit_generator_unsafe=true --xla_tpu_use_enhanced_launch_barrier=true --xla_tpu_use_resilient_collective_emitter=false --xla_tpu_use_single_sparse_core_for_all_gather_offload=false --xla_tpu_use_tc_device_shape_on_sc=True"
                python3 -m maxtext.trainers.pre_train.train maxtext/configs/base.yml \
                  model_name=deepseek3-671b per_device_batch_size=4.0 max_target_length=4096 \
                  ici_fsdp_parallelism=128 ici_expert_parallelism=4 ici_data_parallelism=1 \
                  ici_fsdp_transpose_parallelism=1 dcn_data_parallelism=-1 dcn_pipeline_parallelism=1 ici_pipeline_parallelism=1 \
                  shard_exp_on_fsdp=False use_iota_embed=True tokenizer_path=assets/tokenizer.mistral-v3 \
                  dataset_type=synthetic dataset_path=gs://max-datasets-rogue \
                  opt_type=adamw mu_dtype=bfloat16 grad_dtype=bfloat16 dtype=bfloat16 \
                  sa_use_fused_bwd_kernel=True megablox=True sparse_matmul=True use_tokamax_gmm=True use_gmm_v2=True use_tokamax_splash=True \
                  use_max_logit_estimate=-1 cost_estimate_flops_fwd=5000000000000 cost_estimate_flops_bwd=5000000000000 \
                  float32_weight_sum=False remat_policy=custom allow_split_physical_axes=False decoder_layer_input=device \
                  enable_tpu_profiling_options=True async_checkpointing=False enable_checkpointing=False \
                  attention=flash sa_block_q=2048 sa_block_kv=2048 sa_block_kv_compute=2048 \
                  sa_block_q_dkv=2048 sa_block_kv_dkv=2048 sa_block_kv_dkv_compute=2048 sa_block_kv_dq=2048 sa_block_q_dq=2048 \
                  use_random_routing=True use_ring_of_experts=True use_custom_sort_vjp=True use_ragged_sort=True merge_gating_gmm=False \
                  wi_tile_fwd_batch_seq=256 wi_tile_fwd_embed_dim=7168 wi_tile_fwd_mlp_dim=1024 \
                  wi_tile_dlhs_batch_seq=256 wi_tile_dlhs_embed_dim=3584 wi_tile_dlhs_mlp_dim=2048 \
                  wi_tile_drhs_batch_seq=512 wi_tile_drhs_embed_dim=1792 wi_tile_drhs_mlp_dim=2048 \
                  wo_tile_fwd_batch_seq=512 wo_tile_fwd_embed_dim=3584 wo_tile_fwd_mlp_dim=2048 \
                  wo_tile_dlhs_batch_seq=512 wo_tile_dlhs_embed_dim=1792 wo_tile_dlhs_mlp_dim=2048 \
                  wo_tile_drhs_batch_seq=512 wo_tile_drhs_embed_dim=1792 wo_tile_drhs_mlp_dim=2048 \
                  optimizer_memory_host_offload=True \
                  moe_weight_ag_scheduling_group=True moe_routing_key_as_input=True moe_handwritten_bwd=True \
                  moe_splash_host_offload=True num_moe_token_chunks=2 decouple_combine_rs_chunks=4 \
                  moe_chunked_combine_in_remat=True moe_direct_rs=True moe_direct_token_ag=True moe_direct_combine_ag=True \
                  qk_diag_skip=True qk_diag_grid=4 \
                  steps=30 base_output_directory=gs://sivaibhav-exp/1410-upstream run_name=siv-1410-4x8x8 \
                  profiler=xplane skip_first_n_steps_for_profiler=10 profiler_steps=3
              env:
              - { name: PYTHONUNBUFFERED, value: "1" }
              - { name: JAX_TRACEBACK_FILTERING, value: "off" }
              resources:
                limits:
                  google.com/tpu: "4"
